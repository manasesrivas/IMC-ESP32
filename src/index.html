<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        .network-available{
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 30px;
        }

        .icons{
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .available-name{

        }

        form{
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin: 20px; 
        }
        
        .inputs{
            height: 35px;
            position: relative;
        }
        input{
            font-size: 1em;
            /* padding-left: 15px; */
            border-radius: 7px;
            border: 1px black solid;
            height: 100%;
            width: 100%;
        }
        input:focus{
            outline: 2px solid #8749F2;
        }
        input:focus ~ label, :not(input:placeholder-shown) ~ label{
            top: -3px;
            left: 5px;
            font-size: 0.8em;
        }
        label{
            pointer-events: none;
            padding: 0 5px;
            background: white;
            position:absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 15px;
            transition: all 100ms ease-in-out;
        }

        button{
            background: #8749F2;
            border:none;
            padding: 10px;
            color: white;
            border-radius: 7px;
            width: 100%;
            font-size: 1em;
            margin: 5px 0;
        }
        @media  (width > 700px) {
            button{
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <main>

        <h1 style="text-align: center;">Redes disponibles</h1>
        <div class="network-available">
            <h3 class="available-name">Lorem, ipsum dolor.</h3>
            <div class="icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="15px" height="15px" viewBox="0 0 24 24"><path fill="black" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2m-6 9c-1.1 0-2-.9-2-2s.9-2 2-2s2 .9 2 2s-.9 2-2 2M9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2z"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="30px" height="30px" viewBox="0 0 20 20"><circle cx="10" cy="15" r="2" fill="black"/><path fill="black" d="M1 7.4a12 13 0 0 1 18 0l-1.5 1.4a10 11.1 0 0 0-15 0zm3.7 3.2a7 7.3 0 0 1 10.7 0L14 12a5 5.3 0 0 0-7.8 0z"/></svg>
            </div>
        </div>
        <form action='/validar' method='post'>
            <div class="inputs">
                <input type='text' name='ssid' placeholder=" ">
                <label>SSID</label>
            </div>
            <div class="inputs">
                <input type='password' name='password' placeholder=" ">
                <label>Contraseña</label>
            </div>
            <div class="inputs">
                <button>Conectarse</button>
                <a href=""><button>Actualizar</button></a>
            </div>
        </main>
</form>
</body>
</html>
